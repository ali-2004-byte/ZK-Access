<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZK-Access — Browser Age Proof</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    section { border: 1px solid #d0d7de; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; margin-top: 0.5rem; font-weight: 600; }
    input, textarea, button { font: inherit; margin-top: 0.25rem; }
    textarea { width: 100%; min-height: 7rem; }
    pre { background: #f6f8fa; padding: 0.75rem; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>ZK-Access — Operator Proof Workflow</h1>
  <p>Private <code>birthDate</code> and <code>salt</code> stay in browser memory and are never sent to the verifier.</p>

  <section>
    <h2>1. Operator Session</h2>
    <p id="session-status">Checking session...</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div><button type="submit">Sign in</button></div>
    </form>
  </section>

  <section>
    <h2>2. Import Private Credential JSON</h2>
    <label for="credential-file">Choose credential JSON file</label>
    <input id="credential-file" type="file" accept=".json,application/json">
    <label for="credential-json">Or paste synthetic credential JSON</label>
    <textarea id="credential-json" placeholder="Paste nine-field private credential JSON"></textarea>
    <div><button id="import-text" type="button">Validate &amp; Import</button></div>
    <p id="credential-summary">No credential imported.</p>
  </section>

  <section>
    <h2>3. Generate Groth16 Proof &amp; Verify</h2>
    <button id="prove-submit" type="button" disabled>Request Challenge, Prove &amp; Submit</button>
    <pre id="outcome-box" hidden></pre>
  </section>

  <script src="/vendor/snarkjs.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
